name: Build FriendSMP Updater

on:
  push:
    branches: [main]
    paths:
      - 'updater/**'
      - '!updater/resourcepacks.txt'
      - '!updater/add_resourcepacks.py'
      - '!updater/mods-to-add.txt'
      - '!updater/add_mods.py'
      - '.github/workflows/build-updater.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pack-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build the mod
        shell: bash
        working-directory: updater
        run: gradle build --stacktrace 2>&1 | tee ../build.log

      - name: Put the jar into the modpack
        shell: bash
        run: |
          git pull --rebase origin main
          JAR=$(ls updater/build/libs/CreateFriendSMP-*.jar | grep -v -- '-sources' | head -1)
          python3 updater/publish.py . "$JAR"
          git add -A mods index.toml pack.toml
          git commit -m "Update FriendSMP Updater jar" || echo "nothing changed"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: friendsmp-updater
          path: updater/build/libs/*.jar

      - name: Save build log on failure
        if: failure()
        shell: bash
        run: |
          cp build.log /tmp/build.log || echo "no log" > /tmp/build.log
          git checkout --orphan ci-log
          git rm -rf --cached . > /dev/null
          cp /tmp/build.log build.log
          git add -f build.log
          git commit -m "Build log for ${GITHUB_SHA}"
          git push -f origin ci-log
