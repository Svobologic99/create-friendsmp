name: Sync resource packs and new mods

on:
  push:
    branches: [main]
    paths:
      - 'updater/resourcepacks.txt'
      - 'updater/add_resourcepacks.py'
      - 'updater/mods-to-add.txt'
      - 'updater/add_mods.py'
      - '.github/workflows/resourcepacks.yml'

permissions:
  contents: write

concurrency:
  group: pack-index
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add resource packs from Modrinth
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          python3 updater/add_resourcepacks.py . 2>&1 | tee rp.log
          python3 updater/add_mods.py . 2>&1 | tee -a rp.log
          git add -A resourcepacks mods index.toml pack.toml
          git commit -m "Sync resource packs and new mods" || echo "nothing changed"
          git pull --rebase origin main
          git push
      - name: Save log on failure
        if: failure()
        shell: bash
        run: |
          cp rp.log /tmp/rp.log || echo "no log" > /tmp/rp.log
          git checkout --orphan ci-log
          git rm -rf --cached . > /dev/null
          cp /tmp/rp.log build.log
          git add -f build.log
          git commit -m "Resource pack log for ${GITHUB_SHA}"
          git push -f origin ci-log
